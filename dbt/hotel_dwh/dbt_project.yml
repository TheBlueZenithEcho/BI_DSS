name: hotel_dwh
version: "1.0"
config-version: 2
profile: hotel_dwh

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"

clean-targets:
  - "target"
  - "dbt_modules"

vars:
  adr_max: 1000
  late_cancel_t: 7
  min_group_size: 300
  compensation_multiplier: 1.5
  tight_night_threshold: 0.90

models:
  hotel_dwh:
    staging:
      +materialized: ephemeral
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      +schema: GOLD
      +materialized: table